<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX Mission Planner — Autonomous Survey</title>
    <meta name="description" content="Draw a survey boundary on a map and automatically generate battery-split lawnmower flight paths for autonomous drone surveys.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <link rel="stylesheet" href="planner.css">
</head>
<body>
    <header id="topbar">
        <div class="topbar-left">
            <span class="logo">🔥 PHOENIX</span>
            <span class="subtitle">Mission Planner</span>
        </div>
        <div class="topbar-right">
            <button id="clearBtn" class="btn btn-outline">Clear All</button>
            <button id="exportBtn" class="btn btn-primary">Export Waypoints</button>
        </div>
    </header>

    <main id="app">
        <!-- Left: Map -->
        <section id="mapContainer">
            <div id="map"></div>
            <div id="mapInstructions" class="map-overlay">
                <span>✏️ Use the polygon tool (top-left) to draw your survey boundary</span>
            </div>
        </section>

        <!-- Right: Config & Results -->
        <aside id="sidebar">
            <div class="panel config-panel">
                <div class="panel-header"><h2>⚙ Flight Parameters</h2></div>
                <div class="config-grid">
                    <label for="altitude">Altitude (m)</label>
                    <input type="number" id="altitude" value="50" min="10" max="400" step="5">

                    <label for="fov">Camera FOV (°)</label>
                    <input type="number" id="fov" value="73" min="30" max="120" step="1">

                    <label for="overlap">Photo Overlap (%)</label>
                    <input type="number" id="overlap" value="70" min="30" max="90" step="5">

                    <label for="speed">Cruise Speed (m/s)</label>
                    <input type="number" id="speed" value="8" min="1" max="20" step="0.5">

                    <label for="batteryTime">Battery Time (min)</label>
                    <input type="number" id="batteryTime" value="15" min="5" max="45" step="1">
                </div>
                <p class="config-note">Battery time already includes safety buffer below true limit.</p>
            </div>

            <div class="panel results-panel" id="resultsPanel" style="display:none;">
                <div class="panel-header"><h2>📊 Mission Summary</h2></div>
                <div class="results-grid">
                    <div class="result-item">
                        <span class="result-label">Survey Area</span>
                        <span class="result-value" id="resArea">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Path Length</span>
                        <span class="result-value" id="resLength">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Est. Total Time</span>
                        <span class="result-value" id="resTime">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Est. Photos</span>
                        <span class="result-value" id="resPhotos">—</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Battery Sorties</span>
                        <span class="result-value" id="resSorties">—</span>
                    </div>
                </div>
            </div>

            <div id="sortieList"></div>
        </aside>
    </main>

    <script src="planner.js"></script>
</body>
</html>
